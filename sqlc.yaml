version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/store/migrations"   # sqlc reads the "+goose Up" part
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"             # same package as the hand-written store code
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          # PostgreSQL enums map straight to domain types (no duplicate types).
          - db_type: "serial_status"
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "SerialStatus"
          - db_type: "serial_level"
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "SerialLevel"
          - db_type: "order_status"
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "OrderStatus"
          - db_type: "movement_reason"
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "MovementReason"
          - db_type: "location_type"
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "LocationType"
          - db_type: "serial_status"
            nullable: true
            go_type:
              import: "github.com/HafidhIrsyad/product-engineer-test/internal/domain"
              type: "SerialStatus"
              pointer: true
