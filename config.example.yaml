# Copy to config.yaml for `make run`. Environment variables MGMI_* override these values.
app:
  env: local            # local = console logs + SQL query logs
http:
  port: 8080
  request_timeout: 10s
  drain_delay: 0s        # behind a load balancer: seconds it needs to notice /healthz failing
  shutdown_timeout: 15s  # running requests get this long to finish
database:
  url: postgres://mgmi:mgmi@localhost:5433/mgmi?sslmode=disable
log:
  level: debug          # debug so SQL query logs are visible
sweeper:
  interval: 30s
