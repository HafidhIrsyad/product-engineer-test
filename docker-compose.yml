services:
  postgres:
    image: postgres:18-alpine # keep in sync with internal/testdb
    environment:
      POSTGRES_USER: mgmi
      POSTGRES_PASSWORD: mgmi
      POSTGRES_DB: mgmi
    ports:
      - "5433:5432" # 5433 on the host: 5432 is often taken by a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgmi -d mgmi"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      MGMI_APP_ENV: local     # console logs + SQL query logs (ARCHITECTURE.md §5.2)
      MGMI_LOG_LEVEL: debug
      MGMI_DATABASE_URL: postgres://mgmi:mgmi@postgres:5432/mgmi?sslmode=disable
    stop_grace_period: 30s # longer than http.shutdown_timeout + http.drain_delay, or Docker kills the API mid-shutdown
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
